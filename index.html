<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planetary Gear Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    #main {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    header {
      padding: 8px 16px;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 0.06em;
      color: #88bbdd;
      background: #0d1117;
      flex-shrink: 0;
    }

    #canvas-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      min-height: 0;
      min-width: 0;
    }

    canvas {
      display: block;
    }

    #resultBanner {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 20px;
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid #88bbdd;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1.8rem;
      letter-spacing: 0.04em;
      display: none;
      z-index: 3;
      pointer-events: none;
    }

    #resultBanner.boot-error {
      border-color: #ff6b6b;
      max-width: 92vw;
      font-size: 1rem;
      line-height: 1.4;
    }

    #controls {
      background: #0d1117;
      border-left: 1px solid #222;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-start;
      justify-content: center;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 240px;
      z-index: 2;
    }

    #readouts-bar {
      background: #0d1117;
      border-top: 1px solid #222;
      padding: 10px 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-shrink: 0;
    }

    .ctrl {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .ctrl label {
      font-size: 0.8rem;
      color: #99aacc;
    }

    .ctrl input[type=range] {
      width: 200px;
      cursor: pointer;
      accent-color: #4488cc;
    }

    .ctrl .val {
      font-size: 0.8rem;
      color: #ccddff;
      font-variant-numeric: tabular-nums;
      min-width: 4em;
      text-align: center;
    }

    button {
      padding: 6px 16px;
      background: #2f5476;
      border: 1px solid #75a7d1;
      border-radius: 4px;
      color: #f7fbff;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.15s;
    }

    button:hover { background: #3c6890; }
    button.active {
      background: #1f2e3b;
      border-color: #4a667f;
      color: #b3c4d4;
      box-shadow: none;
      cursor: default;
    }
    button.active:hover { background: #1f2e3b; }
    button:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    .gear-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .gear-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .gear-row .gear-label {
      font-size: 0.75rem;
      color: #778899;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-width: 6.2em;
      text-align: right;
    }

  </style>
</head>
<body>

<header>Planetary Gear Demo</header>

<div id="main">
<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="resultBanner" aria-live="polite"></div>
</div>
<div id="controls">
  <div class="gear-grid">
    <div class="gear-row">
      <span class="gear-label">Astral:</span>
      <button id="btnFixedAstral">Fixed</button>
      <button id="btnDrivenAstral">Driven</button>
    </div>
    <div class="gear-row">
      <span class="gear-label">Sun:</span>
      <button id="btnFixedSun">Fixed</button>
      <button id="btnDrivenSun">Driven</button>
    </div>
    <div class="gear-row">
      <span class="gear-label">Earth:</span>
      <button id="btnFixedEarth">Fixed</button>
      <button id="btnDrivenEarth">Driven</button>
    </div>
  </div>
</div>

</div>

<div id="readouts-bar">
  <div class="ctrl">
    <label id="lblDrive">Driver speed</label>
    <span class="val" id="valDrive">—</span>
  </div>
  <div class="ctrl">
    <label id="lblOutput">Output speed</label>
    <span class="val" id="valOutput">—</span>
  </div>
  <div class="ctrl">
    <label>Impacts</label>
    <span class="val" id="valImpacts">0</span>
  </div>
  <div class="ctrl">
    <label>Repelled</label>
    <span class="val" id="valRepelled">0</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';

(function () {
  'use strict';

  // This is a real-time defense game built around rotating circles, 
  // presented as a stylized medieval cosmological orrery. Meteors appear 
  // on an outer circle called the "Ring of Perdition" and slowly fall inward 
  // toward an inner white circle called the "Wheel of Grace"; if they touch
  // the Wheel of Grace, you take a hit. Your only defense is a rotating white
  // wedge called the "Arc of Grace", attached to the inner Wheel of Grace
  // and extending outward like a sweeping shield. When a meteor passes
  // through that wedge, it is pushed back outward instead of continuing
  // inward, and it only counts as safely cleared once it is forced all the way
  // past an outermost boundary called the Ring of the Abyss. 
  // 
  // Under the theme, the system is mechanically a true planetary gear simulation,
  // similar in principle to an automotive transmission. Earth, Sun, and Astral
  // are the three coupled elements (albeit with the unconventional variant of
  // having Earth be in the center and the Sun orbiting around it, to stay
  // consistent with medieval cosmology). Changing which one is fixed, driven,
  // or free changes the resulting output speed through gear ratios. As a result,
  // playing well is partly about internalizing those ratio relationships so you
  // can predict how each binding choice will reposition the Arc in time to
  // intercept incoming meteors.

  const canvas       = document.getElementById('canvas');
  const wrap         = document.getElementById('canvas-wrap');
  const controls     = document.getElementById('controls');
  const valDrive     = document.getElementById('valDrive');
  const lblOutput    = document.getElementById('lblOutput');
  const lblDrive     = document.getElementById('lblDrive');
  const valOutput    = document.getElementById('valOutput');
  const valImpacts   = document.getElementById('valImpacts');
  const valRepelled  = document.getElementById('valRepelled');
  const resultBanner = document.getElementById('resultBanner');
  const gearButtons  = {
    Earth: {
      fixed: document.getElementById('btnFixedEarth'),
      driven: document.getElementById('btnDrivenEarth')
    },
    Sun: {
      fixed: document.getElementById('btnFixedSun'),
      driven: document.getElementById('btnDrivenSun')
    },
    Astral: {
      fixed: document.getElementById('btnFixedAstral'),
      driven: document.getElementById('btnDrivenAstral')
    }
  };

  // ── planetary gear setup (units are geometric units, then scaled to px) ──
  // Use relatively prime earth/sun tooth counts (both >= 8) for practical geometry.
  const EARTH_TEETH = 13;
  const SUN_TEETH = 8;
  const RING_TEETH = EARTH_TEETH + (2 * SUN_TEETH);

  // Diameters are proportional to tooth counts for consistent kinematic ratios.
  // Normalize by ring teeth so the full train keeps a stable on-canvas size.
  const DIAMETER_SCALE = 3 / RING_TEETH;
  const EARTH_DIAMETER = EARTH_TEETH * DIAMETER_SCALE;
  const SUN_DIAMETER = SUN_TEETH * DIAMETER_SCALE;
  const CARRIER_DIAMETER = EARTH_DIAMETER + SUN_DIAMETER;
  const RING_DIAMETER = EARTH_DIAMETER + (2 * SUN_DIAMETER);

  const EARTH_RADIUS_U = EARTH_DIAMETER * 0.5;
  const SUN_RADIUS_U = SUN_DIAMETER * 0.5;
  const CARRIER_RADIUS_U = CARRIER_DIAMETER * 0.5;
  const RING_RADIUS_U = RING_DIAMETER * 0.5;
  const GRACE_RADIUS_U = RING_RADIUS_U + 0.5; // 1 unit larger diameter than astral ring
  const PERDITION_RADIUS_U = GRACE_RADIUS_U + 1; // outer edge of the wedge
  const ABYSS_RADIUS_U = PERDITION_RADIUS_U + 0.5;

  // Driver speed — whichever gear is DRIVEN spins at this rate.
  const DRIVER_SPEED = (2 * Math.PI) / 6; // rad/s (1/6 rev/s)

  // Map gearState keys to the omega keys returned by computeOmegas().
  const GEAR_OMEGA_KEY = { Earth: 'earth', Astral: 'ring', Sun: 'carrier' };

  // Compute angular velocities from the current gearState.
  // Uses: (Ne + Nr)*wc = Ne*we + Nr*wr  (simple planetary Willis formula)
  function computeOmegas() {
    var Ne = EARTH_TEETH;
    var Ns = SUN_TEETH;
    var Nr = RING_TEETH;
    var ws, wr, wc;

    if      (gearState.Earth     === GearBinding.DRIVEN) ws = DRIVER_SPEED;
    else if (gearState.Earth     === GearBinding.FIXED)  ws = 0;

    if      (gearState.Astral    === GearBinding.DRIVEN) wr = DRIVER_SPEED;
    else if (gearState.Astral    === GearBinding.FIXED)  wr = 0;

    if      (gearState.Sun      === GearBinding.DRIVEN) wc = DRIVER_SPEED;
    else if (gearState.Sun      === GearBinding.FIXED)  wc = 0;

    // Solve for the UNBOUND gear via the planetary relation.
    if      (gearState.Sun      === GearBinding.UNBOUND) wc = (Ne * ws + Nr * wr) / (Ne + Nr);
    else if (gearState.Astral   === GearBinding.UNBOUND) wr = ((Ne + Nr) * wc - Ne * ws) / Nr;
    else if (gearState.Earth    === GearBinding.UNBOUND) ws = ((Ne + Nr) * wc - Nr * wr) / Ne;

    // Sun spin from earth-sun external mesh:
    // (Re + Rs)wc = Re*we + Rs*wsun  ->  wsun = ((Re+Rs)wc - Re*we)/Rs
    // Radii are proportional to tooth counts, so N can be used directly here.
    var wsun = ((Ne + Ns) * wc - (Ne * ws)) / Ns;

    return { earth: ws, ring: wr, carrier: wc, sun: wsun };
  }

  // ── gear state model ──────────────────────────────────────────────────────
  const GearBinding = Object.freeze({
    FIXED: 'Fixed',
    DRIVEN: 'Driven',
    UNBOUND: 'Unbound'
  });

  // Initial setup: Earth fixed, Astral driven, Sun unbound.
  const gearState = {
    Earth: GearBinding.FIXED,
    Sun: GearBinding.UNBOUND,
    Astral: GearBinding.DRIVEN
  };

  // ── animation state ──────────────────────────────────────────────────────
  var angles = { earth: 0, ring: 0, carrier: 0, sun: 0, grace: 0 };
  var lastTimestamp = null;

  // ── meteor ────────────────────────────────────────────────────────────────
  // Descent rate: 1 distance unit in 12 seconds (= 2 full driver revolutions).
  const GRACE_ARC_SPAN = (2 * Math.PI) / 12;
  const METEOR_DESCENT_RATE = 1 / 12; // units per second
  var meteorsImpact = 0;
  var meteorsRepelled = 0;

  function readMaxFromQuery(paramName) {
    var raw = new URLSearchParams(window.location.search).get(paramName);
    if (raw === null || raw === '') return Number.POSITIVE_INFINITY;
    var parsed = Number(raw);
    if (!Number.isFinite(parsed) || parsed < 0) return Number.POSITIVE_INFINITY;
    return Math.floor(parsed);
  }

  var maxImpacts = readMaxFromQuery('maxImpacts');
  var maxRepels = readMaxFromQuery('maxRepels');

  function readNumFromQuery(paramName, defaultVal) {
    var raw = new URLSearchParams(window.location.search).get(paramName);
    if (raw === null || raw === '') return defaultVal;
    var parsed = Number(raw);
    if (!Number.isFinite(parsed) || parsed <= 0) return defaultVal;
    return parsed;
  }

  var meteorInterval = readNumFromQuery('meteorInterval', 10);
  var repulsionForce = readNumFromQuery('repulsionForce', 5);
  const METEOR_EXPULSION_RATE = METEOR_DESCENT_RATE * repulsionForce;
  var gameOver = false;

  function updateVictoryState() {
    if (gameOver) return;

    if (meteorsImpact >= maxImpacts) {
      gameOver = true;
      resultBanner.textContent = 'You lose';
      resultBanner.style.display = 'block';
      return;
    }

    if (meteorsRepelled >= maxRepels) {
      gameOver = true;
      resultBanner.textContent = 'You win!';
      resultBanner.style.display = 'block';
    }
  }

  function normalizeAngle(angle) {
    var twoPi = 2 * Math.PI;
    var out = angle % twoPi;
    if (out < 0) out += twoPi;
    return out;
  }

  function isInGraceArc(angle, graceAngle) {
    var rel = normalizeAngle(angle - graceAngle);
    return rel >= 0 && rel <= GRACE_ARC_SPAN;
  }

  function newMeteor(graceAngle) {
    // Spawn 90..270 degrees away from Arc of Grace orientation.
    var offset = (Math.PI / 2) + (Math.random() * Math.PI);
    return {
      angle: graceAngle + offset,
      omega: (Math.random() * 0.75 - 0.25) * 2 * Math.PI, // [-0.25, +0.5] rev/s in rad/s
      radius: PERDITION_RADIUS_U
    };
  }

  var meteors = [newMeteor(angles.grace)];
  var meteorSpawnTimer = 0;

  // ── rendering (three.js) ─────────────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07090d);

  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);
  camera.position.set(0, 0, 20);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const worldRoot = new THREE.Group();
  scene.add(worldRoot);

  function makeCirclePoints(radius, segments) {
    var pts = [];
    for (var i = 0; i <= segments; i++) {
      var a = (i / segments) * Math.PI * 2;
      pts.push(new THREE.Vector3(radius * Math.cos(a), radius * Math.sin(a), 0));
    }
    return pts;
  }

  function makeRingLine(radius, color, width) {
    var geom = new THREE.BufferGeometry().setFromPoints(makeCirclePoints(radius, 128));
    var mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 1 });
    var line = new THREE.LineLoop(geom, mat);
    line.userData.baseOpacity = 1;
    line.userData.lineWidth = width;
    return line;
  }

  function makeDisk(radius, color) {
    var geom = new THREE.CircleGeometry(radius, 64);
    var mat = new THREE.MeshBasicMaterial({ color: color });
    return new THREE.Mesh(geom, mat);
  }

  function makeWedge(innerR, outerR, arcSpan, color) {
    var geom = new THREE.RingGeometry(innerR, outerR, 64, 1, 0, arcSpan);
    var mat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });
    return new THREE.Mesh(geom, mat);
  }

  function makeMarker(radius, color) {
    var geom = new THREE.CircleGeometry(radius, 24);
    var mat = new THREE.MeshBasicMaterial({ color: color });
    return new THREE.Mesh(geom, mat);
  }

  var ringLine = makeRingLine(RING_RADIUS_U, 0x6b778f, 1.5);
  ringLine.position.z = -0.02;
  worldRoot.add(ringLine);

  var perditionLine = makeRingLine(PERDITION_RADIUS_U, 0x8b0000, 1.5);
  perditionLine.position.z = -0.06;
  worldRoot.add(perditionLine);

  var abyssLine = makeRingLine(ABYSS_RADIUS_U, 0x4d0000, 1.5);
  abyssLine.position.z = -0.07;
  worldRoot.add(abyssLine);

  var carrierOrbit = makeRingLine(CARRIER_RADIUS_U, 0x6f839b, 1);
  carrierOrbit.material.opacity = 0.45;
  carrierOrbit.material.transparent = true;
  carrierOrbit.position.z = -0.01;
  worldRoot.add(carrierOrbit);

  var graceGroup = new THREE.Group();
  graceGroup.position.z = 0.02;
  worldRoot.add(graceGroup);

  var graceRing = makeRingLine(GRACE_RADIUS_U, 0xffffff, 1.5);
  graceGroup.add(graceRing);

  var graceWedge = makeWedge(GRACE_RADIUS_U, ABYSS_RADIUS_U, GRACE_ARC_SPAN, 0xffffff);
  graceWedge.position.z = 0.01;
  // Keep visible wedge aligned with collision interval after render-angle inversion.
  graceWedge.rotation.z = -GRACE_ARC_SPAN;
  graceGroup.add(graceWedge);

  var carrierLineGeom = new THREE.BufferGeometry();
  var carrierLinePos = new Float32Array(6);
  carrierLineGeom.setAttribute('position', new THREE.BufferAttribute(carrierLinePos, 3));
  var carrierLine = new THREE.Line(
    carrierLineGeom,
    new THREE.LineBasicMaterial({ color: 0xb4cdeb, transparent: true, opacity: 0.7 })
  );
  carrierLine.position.z = 0.01;
  worldRoot.add(carrierLine);

  var earthMesh = makeDisk(EARTH_RADIUS_U, 0x1a4d1a);
  earthMesh.position.z = 0.03;
  worldRoot.add(earthMesh);

  var earthOutline = makeRingLine(EARTH_RADIUS_U, 0x8f99aa, 1.5);
  earthOutline.position.z = 0.04;
  worldRoot.add(earthOutline);

  var sunGroup = new THREE.Group();
  sunGroup.position.z = 0.03;
  worldRoot.add(sunGroup);

  var sunMesh = makeDisk(SUN_RADIUS_U, 0xc49000);
  sunGroup.add(sunMesh);

  var sunOutline = makeRingLine(SUN_RADIUS_U, 0x8f99aa, 1.5);
  sunOutline.position.z = 0.01;
  sunGroup.add(sunOutline);

  var earthMarker = makeMarker(0.05, 0x66ff88);
  earthMarker.position.z = 0.1;
  worldRoot.add(earthMarker);

  var sunMarker = makeMarker(0.05, 0xffd84a);
  sunMarker.position.z = 0.1;
  worldRoot.add(sunMarker);

  var ringMarker = makeMarker(0.05, 0xb56dff);
  ringMarker.position.z = 0.1;
  worldRoot.add(ringMarker);

  var centerMarker = makeMarker(0.03, 0x999999);
  centerMarker.position.z = 0.11;
  worldRoot.add(centerMarker);

  var sunCenterMarker = makeMarker(0.03, 0x999999);
  sunCenterMarker.position.z = 0.11;
  worldRoot.add(sunCenterMarker);

  var meteorLayer = new THREE.Group();
  meteorLayer.position.z = 0.2;
  worldRoot.add(meteorLayer);

  // ── helpers ───────────────────────────────────────────────────────────────
  function resizeCanvas() {
    var w = Math.max(1, wrap.clientWidth);
    var h = Math.max(1, wrap.clientHeight);

    canvas.width = w;
    canvas.height = h;

    renderer.setSize(w, h, false);

    var aspect = w / h;
    var viewHeight = 9;
    camera.left = -viewHeight * aspect * 0.5;
    camera.right = viewHeight * aspect * 0.5;
    camera.top = viewHeight * 0.5;
    camera.bottom = -viewHeight * 0.5;
    camera.updateProjectionMatrix();

    layoutControls();
  }

  function layoutControls() {
    var W = canvas.width;
    var H = canvas.height;
    var unitPx = Math.min(W, H) * 0.10;
    var Rr = RING_RADIUS_U * unitPx;
    var panelWidth = controls.offsetWidth || 240;

    // Position the panel in the open area to the right of the wheel,
    // centered between the wheel edge and the screen edge.
    var wheelRight = (W / 2) + Rr;
    var targetCenterX = (wheelRight + W) / 2;
    var left = targetCenterX - (panelWidth / 2);

    // Optical centering: labels are auxiliary, so shift left by ~10ch.
    var probe = document.createElement('span');
    probe.textContent = '0000000000';
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    probe.style.whiteSpace = 'pre';
    controls.appendChild(probe);
    var tenChPx = probe.getBoundingClientRect().width;
    controls.removeChild(probe);
    left -= tenChPx;

    var margin = 12;
    left = Math.max(margin, Math.min(left, W - panelWidth - margin));

    controls.style.right = 'auto';
    controls.style.left = left + 'px';
  }

  // ── readouts ──────────────────────────────────────────────────────────────
  function updateReadouts() {
    var drivenGear  = findGearByBinding(GearBinding.DRIVEN);
    var unboundGear = findGearByBinding(GearBinding.UNBOUND);
    var omegas = computeOmegas();

    valDrive.textContent = (DRIVER_SPEED / (2 * Math.PI)).toFixed(3) + ' rev/s';
    if (drivenGear) lblDrive.textContent = drivenGear + ' (driver)';

    if (unboundGear) {
      var unboundOmega = omegas[GEAR_OMEGA_KEY[unboundGear]];
      lblOutput.textContent = unboundGear + ' output';
      valOutput.textContent = (unboundOmega / (2 * Math.PI)).toFixed(3) + ' rev/s';
    }

    valImpacts.textContent  = meteorsImpact;
    valRepelled.textContent = meteorsRepelled;
  }

  function syncButtonStatesFromGearState() {
    Object.keys(gearButtons).forEach(function (gearName) {
      var state = gearState[gearName];
      var fixedBtn = gearButtons[gearName].fixed;
      var drivenBtn = gearButtons[gearName].driven;

      fixedBtn.classList.toggle('active', state === GearBinding.FIXED);
      drivenBtn.classList.toggle('active', state === GearBinding.DRIVEN);

      fixedBtn.disabled = state === GearBinding.DRIVEN;
      drivenBtn.disabled = state === GearBinding.FIXED;
    });
  }

  function findGearByBinding(binding) {
    return Object.keys(gearState).find(function (gearName) {
      return gearState[gearName] === binding;
    });
  }

  function handleBindingPress(targetBinding) {
    var unboundGear = findGearByBinding(GearBinding.UNBOUND);
    var currentGear = findGearByBinding(targetBinding);
    if (!unboundGear || !currentGear) return;

    gearState[currentGear] = GearBinding.UNBOUND;
    gearState[unboundGear] = targetBinding;
    syncButtonStatesFromGearState();
    updateReadouts();
  }

  Object.keys(gearButtons).forEach(function (gearName) {
    gearButtons[gearName].fixed.addEventListener('click', function () { handleBindingPress(GearBinding.FIXED); });
    gearButtons[gearName].driven.addEventListener('click', function () { handleBindingPress(GearBinding.DRIVEN); });
  });

  syncButtonStatesFromGearState();
  updateReadouts();
  updateVictoryState();

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  handleBindingPress(GearBinding.FIXED);
    if (e.key === 'ArrowRight') handleBindingPress(GearBinding.DRIVEN);
  });

  window.addEventListener('resize', function () {
    resizeCanvas();
  });

  resizeCanvas();

  function clearMeteorLayer() {
    while (meteorLayer.children.length > 0) {
      var child = meteorLayer.children[meteorLayer.children.length - 1];
      meteorLayer.remove(child);
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
    }
  }

  function pushMeteorMesh(x, y) {
    var meteor = makeDisk(0.08, 0xff2200);
    meteor.position.set(x, y, 0);
    meteorLayer.add(meteor);
  }

  function applyBindingGlow(mesh, colorHex, active) {
    if (!mesh || !mesh.material) return;
    mesh.material.color.setHex(colorHex);
    mesh.material.opacity = active ? 1 : 0.7;
    mesh.material.transparent = true;
  }

  // ── draw loop ──────────────────────────────────────────────────────────────
  function draw(timestamp) {
    if (lastTimestamp === null) lastTimestamp = timestamp;
    var dt = (timestamp - lastTimestamp) / 1000; // elapsed seconds since last frame
    lastTimestamp = timestamp;

    var omegas = computeOmegas();
    angles.earth   += omegas.earth   * dt;
    angles.ring    += omegas.ring    * dt;
    angles.carrier += omegas.carrier * dt;
    angles.sun     += omegas.sun     * dt;

    var unboundKey = GEAR_OMEGA_KEY[findGearByBinding(GearBinding.UNBOUND)];
    angles.grace   += (omegas[unboundKey] || 0) * dt;

    // Spawn a new meteor every meteorInterval seconds until game over.
    if (!gameOver) {
      meteorSpawnTimer += dt;
      if (meteorSpawnTimer >= meteorInterval) {
        meteorSpawnTimer -= meteorInterval;
        meteors.push(newMeteor(angles.grace));
      }
    }

    // Update all meteors; collect survivors.
    var survivors = [];
    for (var i = 0; i < meteors.length; i++) {
      var m = meteors[i];
      m.angle += m.omega * dt;
      if (isInGraceArc(m.angle, angles.grace)) {
        m.radius += METEOR_EXPULSION_RATE * dt;
      } else {
        m.radius -= METEOR_DESCENT_RATE * dt;
      }
      if (m.radius <= GRACE_RADIUS_U) {
        meteorsImpact += 1;
        valImpacts.textContent = meteorsImpact;
        updateVictoryState();
      } else if (m.radius >= ABYSS_RADIUS_U) {
        meteorsRepelled += 1;
        valRepelled.textContent = meteorsRepelled;
        updateVictoryState();
      } else {
        survivors.push(m);
      }
    }
    meteors = survivors;

    // Simulation angles are defined in clockwise canvas convention.
    // Three.js uses a y-up coordinate system where positive rotation is CCW,
    // so render with inverted angles to preserve original visual direction.
    var earthAngle      = -angles.earth;
    var ringAngle       = -angles.ring;
    var carrierAngle    = -angles.carrier;
    var sunSpinAngle    = -angles.sun;
    var graceAngle      = -angles.grace;

    var isEarthDriven = gearState.Earth === GearBinding.DRIVEN;
    var isRingDriven = gearState.Astral === GearBinding.DRIVEN;
    var isSunDriven = gearState.Sun === GearBinding.DRIVEN;
    var isEarthFixed = gearState.Earth === GearBinding.FIXED;
    var isRingFixed = gearState.Astral === GearBinding.FIXED;
    var isSunFixed = gearState.Sun === GearBinding.FIXED;
    var isEarthUnbound = gearState.Earth === GearBinding.UNBOUND;
    var isRingUnbound = gearState.Astral === GearBinding.UNBOUND;
    var isSunUnbound = gearState.Sun === GearBinding.UNBOUND;

    // Sun center moves on the carrier radius.
    var sx = CARRIER_RADIUS_U * Math.cos(carrierAngle);
    var sy = CARRIER_RADIUS_U * Math.sin(carrierAngle);

    // Sun 0deg marker rotates with the sun body.
    var sunMarkX = sx + SUN_RADIUS_U * Math.cos(sunSpinAngle);
    var sunMarkY = sy + SUN_RADIUS_U * Math.sin(sunSpinAngle);

    // ── render ──────────────────────────────────────────────────────────────
    graceGroup.rotation.z = graceAngle;
    ringLine.rotation.z = ringAngle;
    carrierOrbit.rotation.z = carrierAngle;
    earthMesh.rotation.z = earthAngle;
    earthOutline.rotation.z = earthAngle;

    sunGroup.position.set(sx, sy, sunGroup.position.z);
    sunGroup.rotation.z = sunSpinAngle;

    carrierLinePos[0] = 0;
    carrierLinePos[1] = 0;
    carrierLinePos[2] = 0;
    carrierLinePos[3] = sx;
    carrierLinePos[4] = sy;
    carrierLinePos[5] = 0;
    carrierLineGeom.attributes.position.needsUpdate = true;

    earthMarker.position.set(
      EARTH_RADIUS_U * Math.cos(earthAngle),
      EARTH_RADIUS_U * Math.sin(earthAngle),
      earthMarker.position.z
    );
    sunMarker.position.set(sunMarkX, sunMarkY, sunMarker.position.z);
    ringMarker.position.set(
      RING_RADIUS_U * Math.cos(ringAngle),
      RING_RADIUS_U * Math.sin(ringAngle),
      ringMarker.position.z
    );
    sunCenterMarker.position.set(sx, sy, sunCenterMarker.position.z);

    clearMeteorLayer();
    for (var mi = 0; mi < meteors.length; mi++) {
      var m = meteors[mi];
      var renderMeteorAngle = -m.angle;
      var meteorX = m.radius * Math.cos(renderMeteorAngle);
      var meteorY = m.radius * Math.sin(renderMeteorAngle);
      pushMeteorMesh(meteorX, meteorY);
    }

    applyBindingGlow(ringLine, isRingDriven ? 0x00b7ff : (isRingFixed ? 0xffb020 : 0xffffff), true);
    applyBindingGlow(carrierOrbit, isSunDriven ? 0x00b7ff : (isSunFixed ? 0xffb020 : 0xffffff), true);
    applyBindingGlow(earthOutline, isEarthDriven ? 0x00b7ff : (isEarthFixed ? 0xffb020 : 0xffffff), true);

    renderer.render(scene, camera);

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);

}());
</script>
