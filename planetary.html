<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planetary Gear Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    #main {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    header {
      padding: 8px 16px;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 0.06em;
      color: #88bbdd;
      background: #0d1117;
      flex-shrink: 0;
    }

    #canvas-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      min-height: 0;
      min-width: 0;
    }

    canvas {
      display: block;
    }

    #controls {
      background: #0d1117;
      border-left: 1px solid #222;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-start;
      justify-content: center;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 240px;
      z-index: 2;
    }

    #readouts-bar {
      background: #0d1117;
      border-top: 1px solid #222;
      padding: 10px 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-shrink: 0;
    }

    .ctrl {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .ctrl label {
      font-size: 0.8rem;
      color: #99aacc;
    }

    .ctrl input[type=range] {
      width: 200px;
      cursor: pointer;
      accent-color: #4488cc;
    }

    .ctrl .val {
      font-size: 0.8rem;
      color: #ccddff;
      font-variant-numeric: tabular-nums;
      min-width: 4em;
      text-align: center;
    }

    button {
      padding: 6px 16px;
      background: #2f5476;
      border: 1px solid #75a7d1;
      border-radius: 4px;
      color: #f7fbff;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.15s;
    }

    button:hover { background: #3c6890; }
    button.active {
      background: #1f2e3b;
      border-color: #4a667f;
      color: #b3c4d4;
      box-shadow: none;
      cursor: default;
    }
    button.active:hover { background: #1f2e3b; }
    button:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    .gear-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .gear-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .gear-row .gear-label {
      font-size: 0.75rem;
      color: #778899;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-width: 6.2em;
      text-align: right;
    }

  </style>
</head>
<body>

<header>Planetary Gear Demo (Sun fixed, Astral ring driven)</header>

<div id="main">
<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>
<div id="controls">
  <div class="gear-grid">
    <div class="gear-row">
      <span class="gear-label">Astral:</span>
      <button id="btnFixedAstral">Fixed</button>
      <button id="btnDrivenAstral">Driven</button>
    </div>
    <div class="gear-row">
      <span class="gear-label">Planetary:</span>
      <button id="btnFixedPlanetary">Fixed</button>
      <button id="btnDrivenPlanetary">Driven</button>
    </div>
    <div class="gear-row">
      <span class="gear-label">Solar:</span>
      <button id="btnFixedSolar">Fixed</button>
      <button id="btnDrivenSolar">Driven</button>
    </div>
  </div>
</div>

</div>

<div id="readouts-bar">
  <div class="ctrl">
    <label id="lblDrive">Driver speed</label>
    <span class="val" id="valDrive">—</span>
  </div>
  <div class="ctrl">
    <label id="lblOutput">Output speed</label>
    <span class="val" id="valOutput">—</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  const canvas       = document.getElementById('canvas');
  const ctx          = canvas.getContext('2d');
  const wrap         = document.getElementById('canvas-wrap');
  const controls     = document.getElementById('controls');
  const valDrive     = document.getElementById('valDrive');
  const lblOutput    = document.getElementById('lblOutput');
  const lblDrive     = document.getElementById('lblDrive');
  const valOutput    = document.getElementById('valOutput');
  const gearButtons  = {
    Solar: {
      fixed: document.getElementById('btnFixedSolar'),
      driven: document.getElementById('btnDrivenSolar')
    },
    Planetary: {
      fixed: document.getElementById('btnFixedPlanetary'),
      driven: document.getElementById('btnDrivenPlanetary')
    },
    Astral: {
      fixed: document.getElementById('btnFixedAstral'),
      driven: document.getElementById('btnDrivenAstral')
    }
  };

  // ── planetary gear setup (units are geometric units, then scaled to px) ──
  // Use relatively prime sun/planet tooth counts (both >= 8) for practical geometry.
  const SUN_TEETH = 13;
  const PLANET_TEETH = 8;
  const RING_TEETH = SUN_TEETH + (2 * PLANET_TEETH);

  // Diameters are proportional to tooth counts for consistent kinematic ratios.
  // Normalize by ring teeth so the full train keeps a stable on-canvas size.
  const DIAMETER_SCALE = 3 / RING_TEETH;
  const SUN_DIAMETER = SUN_TEETH * DIAMETER_SCALE;
  const PLANET_DIAMETER = PLANET_TEETH * DIAMETER_SCALE;
  const CARRIER_DIAMETER = SUN_DIAMETER + PLANET_DIAMETER;
  const RING_DIAMETER = SUN_DIAMETER + (2 * PLANET_DIAMETER);

  const SUN_RADIUS_U = SUN_DIAMETER * 0.5;
  const PLANET_RADIUS_U = PLANET_DIAMETER * 0.5;
  const CARRIER_RADIUS_U = CARRIER_DIAMETER * 0.5;
  const RING_RADIUS_U = RING_DIAMETER * 0.5;

  // Driver speed — whichever gear is DRIVEN spins at this rate.
  const DRIVER_SPEED = (2 * Math.PI) / 6; // rad/s (1/6 rev/s)

  // Map gearState keys to the omega keys returned by computeOmegas().
  const GEAR_OMEGA_KEY = { Solar: 'sun', Astral: 'ring', Planetary: 'carrier' };

  // Compute angular velocities from the current gearState.
  // Uses: (Ns + Nr)*wc = Ns*ws + Nr*wr  (simple planetary Willis formula)
  function computeOmegas() {
    var Ns = SUN_TEETH;
    var Np = PLANET_TEETH;
    var Nr = RING_TEETH;
    var ws, wr, wc;

    if      (gearState.Solar     === GearBinding.DRIVEN) ws = DRIVER_SPEED;
    else if (gearState.Solar     === GearBinding.FIXED)  ws = 0;

    if      (gearState.Astral    === GearBinding.DRIVEN) wr = DRIVER_SPEED;
    else if (gearState.Astral    === GearBinding.FIXED)  wr = 0;

    if      (gearState.Planetary === GearBinding.DRIVEN) wc = DRIVER_SPEED;
    else if (gearState.Planetary === GearBinding.FIXED)  wc = 0;

    // Solve for the UNBOUND gear via the planetary relation.
    if      (gearState.Planetary === GearBinding.UNBOUND) wc = (Ns * ws + Nr * wr) / (Ns + Nr);
    else if (gearState.Astral    === GearBinding.UNBOUND) wr = ((Ns + Nr) * wc - Ns * ws) / Nr;
    else if (gearState.Solar     === GearBinding.UNBOUND) ws = ((Ns + Nr) * wc - Nr * wr) / Ns;

    // Planet spin from sun-planet external mesh:
    // (Rs + Rp)wc = Rs*ws + Rp*wp  ->  wp = ((Rs+Rp)wc - Rs*ws)/Rp
    // Radii are proportional to tooth counts, so N can be used directly here.
    var wp = ((Ns + Np) * wc - (Ns * ws)) / Np;

    return { sun: ws, ring: wr, carrier: wc, planet: wp };
  }

  // ── gear state model ──────────────────────────────────────────────────────
  const GearBinding = Object.freeze({
    FIXED: 'Fixed',
    DRIVEN: 'Driven',
    UNBOUND: 'Unbound'
  });

  // Initial setup: Solar fixed, Astral driven, Planetary unbound.
  const gearState = {
    Solar: GearBinding.FIXED,
    Planetary: GearBinding.UNBOUND,
    Astral: GearBinding.DRIVEN
  };

  // ── animation state ──────────────────────────────────────────────────────
  var angles = { sun: 0, ring: 0, carrier: 0, planet: 0 };
  var lastTimestamp = null;

  // ── helpers ───────────────────────────────────────────────────────────────
  function resizeCanvas() {
    canvas.width  = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    layoutControls();
  }

  function layoutControls() {
    var W = canvas.width;
    var H = canvas.height;
    var unitPx = Math.min(W, H) * 0.24;
    var Rr = RING_RADIUS_U * unitPx;
    var panelWidth = controls.offsetWidth || 240;

    // Position the panel in the open area to the right of the wheel,
    // centered between the wheel edge and the screen edge.
    var wheelRight = (W / 2) + Rr;
    var targetCenterX = (wheelRight + W) / 2;
    var left = targetCenterX - (panelWidth / 2);

    // Optical centering: labels are auxiliary, so shift left by ~10ch.
    var probe = document.createElement('span');
    probe.textContent = '0000000000';
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    probe.style.whiteSpace = 'pre';
    controls.appendChild(probe);
    var tenChPx = probe.getBoundingClientRect().width;
    controls.removeChild(probe);
    left -= tenChPx;

    var margin = 12;
    left = Math.max(margin, Math.min(left, W - panelWidth - margin));

    controls.style.right = 'auto';
    controls.style.left = left + 'px';
  }

  // ── readouts ──────────────────────────────────────────────────────────────
  function updateReadouts() {
    var drivenGear  = findGearByBinding(GearBinding.DRIVEN);
    var unboundGear = findGearByBinding(GearBinding.UNBOUND);
    var omegas = computeOmegas();

    valDrive.textContent = (DRIVER_SPEED / (2 * Math.PI)).toFixed(3) + ' rev/s';
    if (drivenGear) lblDrive.textContent = drivenGear + ' (driver)';

    if (unboundGear) {
      var unboundOmega = omegas[GEAR_OMEGA_KEY[unboundGear]];
      lblOutput.textContent = unboundGear + ' output';
      valOutput.textContent = (unboundOmega / (2 * Math.PI)).toFixed(3) + ' rev/s';
    }
  }

  function syncButtonStatesFromGearState() {
    Object.keys(gearButtons).forEach(function (gearName) {
      var state = gearState[gearName];
      var fixedBtn = gearButtons[gearName].fixed;
      var drivenBtn = gearButtons[gearName].driven;

      fixedBtn.classList.toggle('active', state === GearBinding.FIXED);
      drivenBtn.classList.toggle('active', state === GearBinding.DRIVEN);

      fixedBtn.disabled = state === GearBinding.DRIVEN;
      drivenBtn.disabled = state === GearBinding.FIXED;
    });
  }

  function findGearByBinding(binding) {
    return Object.keys(gearState).find(function (gearName) {
      return gearState[gearName] === binding;
    });
  }

  function handleBindingPress(targetBinding) {
    var unboundGear = findGearByBinding(GearBinding.UNBOUND);
    var currentGear = findGearByBinding(targetBinding);
    if (!unboundGear || !currentGear) return;

    gearState[currentGear] = GearBinding.UNBOUND;
    gearState[unboundGear] = targetBinding;
    syncButtonStatesFromGearState();
    updateReadouts();
  }

  Object.keys(gearButtons).forEach(function (gearName) {
    gearButtons[gearName].fixed.addEventListener('click', function () { handleBindingPress(GearBinding.FIXED); });
    gearButtons[gearName].driven.addEventListener('click', function () { handleBindingPress(GearBinding.DRIVEN); });
  });

  syncButtonStatesFromGearState();
  updateReadouts();

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  handleBindingPress(GearBinding.FIXED);
    if (e.key === 'ArrowRight') handleBindingPress(GearBinding.DRIVEN);
  });

  window.addEventListener('resize', function () {
    resizeCanvas();
  });

  resizeCanvas();

  // ── tooth tick helper ─────────────────────────────────────────────────────
  /**
   * Draw evenly-spaced radial tick marks around a pitch circle.
   * Call this with the canvas already translated to the gear's centre.
   * @param {number} r      - pitch radius in px
   * @param {number} teeth  - number of teeth (= number of ticks)
   * @param {number} angle  - current rotation of the gear body (radians)
   * @param {number} len    - tick length in px (positive = outward)
   */
  function drawTicks(r, teeth, angle, len) {
    var step = (2 * Math.PI) / teeth;
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#aabbcc';
    ctx.beginPath();
    for (var i = 0; i < teeth; i++) {
      var a = angle + i * step;
      var cos = Math.cos(a);
      var sin = Math.sin(a);
      ctx.moveTo(r * cos, r * sin);
      ctx.lineTo((r + len) * cos, (r + len) * sin);
    }
    ctx.stroke();
  }

  // ── draw loop ──────────────────────────────────────────────────────────────
  function draw(timestamp) {
    if (lastTimestamp === null) lastTimestamp = timestamp;
    var dt = (timestamp - lastTimestamp) / 1000; // elapsed seconds since last frame
    lastTimestamp = timestamp;

    var omegas = computeOmegas();
    angles.sun     += omegas.sun     * dt;
    angles.ring    += omegas.ring    * dt;
    angles.carrier += omegas.carrier * dt;
    angles.planet  += omegas.planet  * dt;

    var W = canvas.width;
    var H = canvas.height;
    var unitPx = Math.min(W, H) * 0.24;

    var Rs = SUN_RADIUS_U * unitPx;
    var Rp = PLANET_RADIUS_U * unitPx;
    var Rc = CARRIER_RADIUS_U * unitPx;
    var Rr = RING_RADIUS_U * unitPx;

    // Positive angles are clockwise in canvas coordinates.
    var sunAngle        = angles.sun;
    var ringAngle       = angles.ring;
    var carrierAngle    = angles.carrier;
    var planetSpinAngle = angles.planet;

    var isSunDriven = gearState.Solar === GearBinding.DRIVEN;
    var isRingDriven = gearState.Astral === GearBinding.DRIVEN;
    var isCarrierDriven = gearState.Planetary === GearBinding.DRIVEN;
    var isSunFixed = gearState.Solar === GearBinding.FIXED;
    var isRingFixed = gearState.Astral === GearBinding.FIXED;
    var isCarrierFixed = gearState.Planetary === GearBinding.FIXED;
    var isSunUnbound = gearState.Solar === GearBinding.UNBOUND;
    var isRingUnbound = gearState.Astral === GearBinding.UNBOUND;
    var isCarrierUnbound = gearState.Planetary === GearBinding.UNBOUND;

    // Planet center moves on the carrier radius.
    var px = Rc * Math.cos(carrierAngle);
    var py = Rc * Math.sin(carrierAngle);

    // Planet 0deg marker rotates with the planet body.
    var pMarkX = px + Rp * Math.cos(planetSpinAngle);
    var pMarkY = py + Rp * Math.sin(planetSpinAngle);

    // ── render ──────────────────────────────────────────────────────────────
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);

    // Ring gear (astral) shown as a thick annulus.
    ctx.beginPath();
    ctx.arc(0, 0, Rr + 7, 0, 2 * Math.PI);
    ctx.arc(0, 0, Rr - 7, 0, 2 * Math.PI, true);
    ctx.fillStyle = '#2b3240';
    ctx.fill();
    ctx.lineWidth = isRingDriven ? 3 : (isRingFixed ? 2.5 : (isRingUnbound ? 2.5 : 1.5));
    ctx.strokeStyle = isRingDriven ? '#00b7ff' : (isRingFixed ? '#ffb020' : (isRingUnbound ? '#ffffff' : '#6b778f'));
    ctx.stroke();
    drawTicks(Rr, RING_TEETH, ringAngle, -(Rr * 0.04)); // inward ticks

    // Carrier arm.
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(px, py);
    ctx.strokeStyle = 'rgba(180, 205, 235, 0.7)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Carrier circle (not a gear, but useful for visualizing carrier rotation).
    ctx.beginPath();
    ctx.arc(0, 0, Rc, 0, 2 * Math.PI);
    ctx.strokeStyle = isCarrierDriven ? '#00b7ff' : (isCarrierFixed ? '#ffb020' : (isCarrierUnbound ? '#ffffff' : 'rgba(180, 205, 235, 0.35)'));
    ctx.lineWidth = isCarrierDriven ? 2.5 : (isCarrierFixed ? 2.25 : (isCarrierUnbound ? 2.25 : 1));
    ctx.stroke();
    drawTicks(Rc, SUN_TEETH, carrierAngle, Rc * 0.06);

    // Sun gear.
    ctx.beginPath();
    ctx.arc(0, 0, Rs, 0, 2 * Math.PI);
    ctx.fillStyle = '#2d3036';
    ctx.fill();
    ctx.lineWidth = isSunDriven ? 3 : (isSunFixed ? 2.5 : (isSunUnbound ? 2.5 : 1.5));
    ctx.strokeStyle = isSunDriven ? '#00b7ff' : (isSunFixed ? '#ffb020' : (isSunUnbound ? '#ffffff' : '#8f99aa'));
    ctx.stroke();
    drawTicks(Rs, SUN_TEETH, sunAngle, Rs * 0.12);

    // Planet gear.
    ctx.save();
    ctx.translate(px, py);
    ctx.beginPath();
    ctx.arc(0, 0, Rp, 0, 2 * Math.PI);
    ctx.fillStyle = '#2d3036';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#8f99aa';
    ctx.stroke();
    drawTicks(Rp, PLANET_TEETH, planetSpinAngle, Rp * 0.12);
    ctx.restore();

    // 0deg marker dots for visible rotation state.
    var sunMarkX = Rs * Math.cos(sunAngle);
    var sunMarkY = Rs * Math.sin(sunAngle);
    ctx.beginPath();
    ctx.arc(sunMarkX, sunMarkY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#ffd84a'; // yellow (sun)
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pMarkX, pMarkY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#66ff88'; // green (planet)
    ctx.fill();

    var ringMarkX = Rr * Math.cos(ringAngle);
    var ringMarkY = Rr * Math.sin(ringAngle);
    ctx.beginPath();
    ctx.arc(ringMarkX, ringMarkY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#b56dff'; // violet (astral ring)
    ctx.fill();

    // Centres.
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, 2 * Math.PI);
    ctx.fillStyle = '#999';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(px, py, 3, 0, 2 * Math.PI);
    ctx.fillStyle = '#999';
    ctx.fill();

    ctx.restore();

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
}());
</script>

</body>
</html>
