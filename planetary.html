<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planetary Gear Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    #main {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    header {
      padding: 8px 16px;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 0.06em;
      color: #88bbdd;
      background: #0d1117;
      flex-shrink: 0;
    }

    #canvas-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      min-height: 0;
      min-width: 0;
    }

    canvas {
      display: block;
    }

    #controls {
      background: #0d1117;
      border-left: 1px solid #222;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-start;
      justify-content: center;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 240px;
      z-index: 2;
    }

    #readouts-bar {
      background: #0d1117;
      border-top: 1px solid #222;
      padding: 10px 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-shrink: 0;
    }

    .ctrl {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .ctrl label {
      font-size: 0.8rem;
      color: #99aacc;
    }

    .ctrl input[type=range] {
      width: 200px;
      cursor: pointer;
      accent-color: #4488cc;
    }

    .ctrl .val {
      font-size: 0.8rem;
      color: #ccddff;
      font-variant-numeric: tabular-nums;
      min-width: 4em;
      text-align: center;
    }

    button {
      padding: 6px 16px;
      background: #2f5476;
      border: 1px solid #75a7d1;
      border-radius: 4px;
      color: #f7fbff;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.15s;
    }

    button:hover { background: #3c6890; }
    button.active {
      background: #1f2e3b;
      border-color: #4a667f;
      color: #b3c4d4;
      box-shadow: none;
      cursor: default;
    }
    button.active:hover { background: #1f2e3b; }
    button:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    .gear-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .gear-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .gear-row .gear-label {
      font-size: 0.75rem;
      color: #778899;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-width: 6.2em;
      text-align: right;
    }

  </style>
</head>
<body>

<header>Planetary Gear Demo (Sun fixed, Astral ring driven)</header>

<div id="main">
<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>
<div id="controls">
  <div class="gear-grid">
    <div class="gear-row">
      <span class="gear-label">Astral:</span>
      <button id="btnFixedAstral">Fixed</button>
      <button id="btnDrivenAstral">Driven</button>
    </div>
    <div class="gear-row">
      <span class="gear-label">Planetary:</span>
      <button id="btnFixedPlanetary">Fixed</button>
      <button id="btnDrivenPlanetary">Driven</button>
    </div>
    <div class="gear-row">
      <span class="gear-label">Solar:</span>
      <button id="btnFixedSolar">Fixed</button>
      <button id="btnDrivenSolar">Driven</button>
    </div>
  </div>
</div>

</div>

<div id="readouts-bar">
  <div class="ctrl">
    <label>Driver speed (ring)</label>
    <span class="val" id="valDrive">0.167 rev/s</span>
  </div>
  <div class="ctrl">
    <label>Carrier speed</label>
    <span class="val" id="valCarrier">0.125 rev/s</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  const canvas       = document.getElementById('canvas');
  const ctx          = canvas.getContext('2d');
  const wrap         = document.getElementById('canvas-wrap');
  const controls     = document.getElementById('controls');
  const valDrive     = document.getElementById('valDrive');
  const valCarrier   = document.getElementById('valCarrier');
  const gearButtons  = {
    Solar: {
      fixed: document.getElementById('btnFixedSolar'),
      driven: document.getElementById('btnDrivenSolar')
    },
    Planetary: {
      fixed: document.getElementById('btnFixedPlanetary'),
      driven: document.getElementById('btnDrivenPlanetary')
    },
    Astral: {
      fixed: document.getElementById('btnFixedAstral'),
      driven: document.getElementById('btnDrivenAstral')
    }
  };

  // ── planetary gear setup (units are geometric units, then scaled to px) ──
  const SUN_DIAMETER = 1;
  const PLANET_DIAMETER = 1;
  const CARRIER_DIAMETER = 2;
  const RING_DIAMETER = 3;

  const SUN_RADIUS_U = SUN_DIAMETER * 0.5;
  const PLANET_RADIUS_U = PLANET_DIAMETER * 0.5;
  const CARRIER_RADIUS_U = CARRIER_DIAMETER * 0.5;
  const RING_RADIUS_U = RING_DIAMETER * 0.5;

  // Ring (astral gear) is driven at 1/6 rev/s clockwise.
  const OMEGA_RING = (2 * Math.PI) / 6;
  // Sun fixed.
  const OMEGA_SUN = 0;
  // Simple planetary relation: (Ns + Nr)wc = Ns*ws + Nr*wr.
  // Tooth counts are proportional to diameters here: Ns = 1, Nr = 3.
  const OMEGA_CARRIER = (SUN_DIAMETER * OMEGA_SUN + RING_DIAMETER * OMEGA_RING) /
    (SUN_DIAMETER + RING_DIAMETER);
  // Planet spin from external mesh with fixed sun (Rs = Rp): wp = 2*wc - ws.
  const OMEGA_PLANET = (2 * OMEGA_CARRIER) - OMEGA_SUN;

  // ── gear state model ──────────────────────────────────────────────────────
  const GearBinding = Object.freeze({
    FIXED: 'Fixed',
    DRIVEN: 'Driven',
    UNBOUND: 'Unbound'
  });

  // Initial setup: Solar fixed, Astral driven, Planetary unbound.
  const gearState = {
    Solar: GearBinding.FIXED,
    Planetary: GearBinding.UNBOUND,
    Astral: GearBinding.DRIVEN
  };

  // ── animation state ──────────────────────────────────────────────────────
  let startTime = null;

  // ── helpers ───────────────────────────────────────────────────────────────
  function resizeCanvas() {
    canvas.width  = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    layoutControls();
  }

  function layoutControls() {
    var W = canvas.width;
    var H = canvas.height;
    var unitPx = Math.min(W, H) * 0.24;
    var Rr = RING_RADIUS_U * unitPx;
    var panelWidth = controls.offsetWidth || 240;

    // Position the panel in the open area to the right of the wheel,
    // centered between the wheel edge and the screen edge.
    var wheelRight = (W / 2) + Rr;
    var targetCenterX = (wheelRight + W) / 2;
    var left = targetCenterX - (panelWidth / 2);

    // Optical centering: labels are auxiliary, so shift left by ~10ch.
    var probe = document.createElement('span');
    probe.textContent = '0000000000';
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    probe.style.whiteSpace = 'pre';
    controls.appendChild(probe);
    var tenChPx = probe.getBoundingClientRect().width;
    controls.removeChild(probe);
    left -= tenChPx;

    var margin = 12;
    left = Math.max(margin, Math.min(left, W - panelWidth - margin));

    controls.style.right = 'auto';
    controls.style.left = left + 'px';
  }

  // ── controls ──────────────────────────────────────────────────────────────
  valDrive.textContent = (OMEGA_RING / (2 * Math.PI)).toFixed(3) + ' rev/s';
  valCarrier.textContent = (OMEGA_CARRIER / (2 * Math.PI)).toFixed(3) + ' rev/s';

  function syncButtonStatesFromGearState() {
    Object.keys(gearButtons).forEach(function (gearName) {
      var state = gearState[gearName];
      var fixedBtn = gearButtons[gearName].fixed;
      var drivenBtn = gearButtons[gearName].driven;

      fixedBtn.classList.toggle('active', state === GearBinding.FIXED);
      drivenBtn.classList.toggle('active', state === GearBinding.DRIVEN);

      fixedBtn.disabled = state === GearBinding.DRIVEN;
      drivenBtn.disabled = state === GearBinding.FIXED;
    });
  }

  function findGearByBinding(binding) {
    return Object.keys(gearState).find(function (gearName) {
      return gearState[gearName] === binding;
    });
  }

  function handleFixedPress() {
    var unboundGear = findGearByBinding(GearBinding.UNBOUND);
    var fixedGear = findGearByBinding(GearBinding.FIXED);
    if (!unboundGear || !fixedGear) return;

    gearState[fixedGear] = GearBinding.UNBOUND;
    gearState[unboundGear] = GearBinding.FIXED;
    syncButtonStatesFromGearState();
  }

  function handleDrivenPress() {
    var unboundGear = findGearByBinding(GearBinding.UNBOUND);
    var drivenGear = findGearByBinding(GearBinding.DRIVEN);
    if (!unboundGear || !drivenGear) return;

    gearState[drivenGear] = GearBinding.UNBOUND;
    gearState[unboundGear] = GearBinding.DRIVEN;
    syncButtonStatesFromGearState();
  }

  Object.keys(gearButtons).forEach(function (gearName) {
    gearButtons[gearName].fixed.addEventListener('click', handleFixedPress);
    gearButtons[gearName].driven.addEventListener('click', handleDrivenPress);
  });

  syncButtonStatesFromGearState();

  window.addEventListener('resize', function () {
    resizeCanvas();
  });

  resizeCanvas();

  // ── tooth tick helper ─────────────────────────────────────────────────────
  /**
   * Draw evenly-spaced radial tick marks around a pitch circle.
   * Call this with the canvas already translated to the gear's centre.
   * @param {number} r      - pitch radius in px
   * @param {number} teeth  - number of teeth (= number of ticks)
   * @param {number} angle  - current rotation of the gear body (radians)
   * @param {number} len    - tick length in px (positive = outward)
   */
  function drawTicks(r, teeth, angle, len) {
    var step = (2 * Math.PI) / teeth;
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#aabbcc';
    ctx.beginPath();
    for (var i = 0; i < teeth; i++) {
      var a = angle + i * step;
      var cos = Math.cos(a);
      var sin = Math.sin(a);
      ctx.moveTo(r * cos, r * sin);
      ctx.lineTo((r + len) * cos, (r + len) * sin);
    }
    ctx.stroke();
  }

  // ── draw loop ──────────────────────────────────────────────────────────────
  function draw(timestamp) {
    if (startTime === null) startTime = timestamp;
    var t = (timestamp - startTime) / 1000; // elapsed seconds
    var W = canvas.width;
    var H = canvas.height;
    var unitPx = Math.min(W, H) * 0.24;

    var Rs = SUN_RADIUS_U * unitPx;
    var Rp = PLANET_RADIUS_U * unitPx;
    var Rc = CARRIER_RADIUS_U * unitPx;
    var Rr = RING_RADIUS_U * unitPx;

    // Positive angles are clockwise in canvas coordinates.
    var sunAngle = OMEGA_SUN * t;
    var ringAngle = OMEGA_RING * t;
    var carrierAngle = OMEGA_CARRIER * t;
    var planetSpinAngle = OMEGA_PLANET * t;

    // Planet center moves on the carrier radius.
    var px = Rc * Math.cos(carrierAngle);
    var py = Rc * Math.sin(carrierAngle);

    // Planet 0deg marker rotates with the planet body.
    var pMarkX = px + Rp * Math.cos(planetSpinAngle);
    var pMarkY = py + Rp * Math.sin(planetSpinAngle);

    // ── render ──────────────────────────────────────────────────────────────
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);

    // Ring gear (astral) shown as a thick annulus.
    ctx.beginPath();
    ctx.arc(0, 0, Rr + 7, 0, 2 * Math.PI);
    ctx.arc(0, 0, Rr - 7, 0, 2 * Math.PI, true);
    ctx.fillStyle = '#2b3240';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#6b778f';
    ctx.stroke();
    drawTicks(Rr, 108, ringAngle, -(Rr * 0.04)); // inward ticks

    // Carrier arm.
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(px, py);
    ctx.strokeStyle = 'rgba(180, 205, 235, 0.7)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Carrier circle (not a gear, but useful for visualizing carrier rotation).
    ctx.beginPath();
    ctx.arc(0, 0, Rc, 0, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(180, 205, 235, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    drawTicks(Rc, 36, carrierAngle, Rc * 0.06);

    // Sun gear.
    ctx.beginPath();
    ctx.arc(0, 0, Rs, 0, 2 * Math.PI);
    ctx.fillStyle = '#2d3036';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#8f99aa';
    ctx.stroke();
    drawTicks(Rs, 36, sunAngle, Rs * 0.12);

    // Planet gear.
    ctx.save();
    ctx.translate(px, py);
    ctx.beginPath();
    ctx.arc(0, 0, Rp, 0, 2 * Math.PI);
    ctx.fillStyle = '#2d3036';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#8f99aa';
    ctx.stroke();
    drawTicks(Rp, 36, planetSpinAngle, Rp * 0.12);
    ctx.restore();

    // 0deg marker dots for visible rotation state.
    var sunMarkX = Rs * Math.cos(sunAngle);
    var sunMarkY = Rs * Math.sin(sunAngle);
    ctx.beginPath();
    ctx.arc(sunMarkX, sunMarkY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#ffd84a'; // yellow (sun)
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pMarkX, pMarkY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#66ff88'; // green (planet)
    ctx.fill();

    var ringMarkX = Rr * Math.cos(ringAngle);
    var ringMarkY = Rr * Math.sin(ringAngle);
    ctx.beginPath();
    ctx.arc(ringMarkX, ringMarkY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#b56dff'; // violet (astral ring)
    ctx.fill();

    // Centres.
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, 2 * Math.PI);
    ctx.fillStyle = '#999';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(px, py, 3, 0, 2 * Math.PI);
    ctx.fillStyle = '#999';
    ctx.fill();

    ctx.restore();

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
}());
</script>

</body>
</html>
