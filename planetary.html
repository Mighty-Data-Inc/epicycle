<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planetary Gear Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    header {
      padding: 8px 16px;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 0.06em;
      color: #88bbdd;
      background: #0d1117;
      flex-shrink: 0;
    }

    #canvas-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    canvas {
      display: block;
    }

    #controls {
      background: #0d1117;
      border-top: 1px solid #222;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ctrl {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .ctrl label {
      font-size: 0.8rem;
      color: #99aacc;
    }

    .ctrl input[type=range] {
      width: 200px;
      cursor: pointer;
      accent-color: #4488cc;
    }

    .ctrl .val {
      font-size: 0.8rem;
      color: #ccddff;
      font-variant-numeric: tabular-nums;
      min-width: 4em;
      text-align: center;
    }

    button {
      padding: 6px 16px;
      background: #1e2d3d;
      border: 1px solid #2e4d6d;
      border-radius: 4px;
      color: #cce;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.15s;
    }

    button:hover { background: #2a3f55; }
  </style>
</head>
<body>

<header>Planetary Gear Demo (Sun fixed, Astral ring driven)</header>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div id="controls">
  <div class="ctrl">
    <label>Driver speed (ring)</label>
    <span class="val" id="valDrive">0.167 rev/s</span>
  </div>
  <div class="ctrl">
    <label>Carrier speed</label>
    <span class="val" id="valCarrier">0.125 rev/s</span>
  </div>
  <div class="ctrl">
    <button id="btnClear">Clear Trail</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const canvas       = document.getElementById('canvas');
  const ctx          = canvas.getContext('2d');
  const wrap         = document.getElementById('canvas-wrap');
  const valDrive     = document.getElementById('valDrive');
  const valCarrier   = document.getElementById('valCarrier');
  const btnClear     = document.getElementById('btnClear');

  // ── planetary gear setup (units are geometric units, then scaled to px) ──
  const SUN_DIAMETER = 1;
  const PLANET_DIAMETER = 1;
  const CARRIER_DIAMETER = 2;
  const RING_DIAMETER = 3;

  const SUN_RADIUS_U = SUN_DIAMETER * 0.5;
  const PLANET_RADIUS_U = PLANET_DIAMETER * 0.5;
  const CARRIER_RADIUS_U = CARRIER_DIAMETER * 0.5;
  const RING_RADIUS_U = RING_DIAMETER * 0.5;

  // Ring (astral gear) is driven at 1/6 rev/s clockwise.
  const OMEGA_RING = (2 * Math.PI) / 6;
  // Sun fixed.
  const OMEGA_SUN = 0;
  // Simple planetary relation: (Ns + Nr)wc = Ns*ws + Nr*wr.
  // Tooth counts are proportional to diameters here: Ns = 1, Nr = 3.
  const OMEGA_CARRIER = (SUN_DIAMETER * OMEGA_SUN + RING_DIAMETER * OMEGA_RING) /
    (SUN_DIAMETER + RING_DIAMETER);
  // Planet spin from external mesh with fixed sun (Rs = Rp): wp = 2*wc - ws.
  const OMEGA_PLANET = (2 * OMEGA_CARRIER) - OMEGA_SUN;

  // ── trail ────────────────────────────────────────────────────────────────
  /** Positions of the planet 0deg marker in canvas-centred coordinates. */
  let trail = [];
  const TRAIL_MAX = 6000;

  // ── animation state ──────────────────────────────────────────────────────
  let startTime = null;

  // ── helpers ───────────────────────────────────────────────────────────────
  function resizeCanvas() {
    canvas.width  = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
  }

  function clearTrail() { trail = []; }

  // ── controls ──────────────────────────────────────────────────────────────
  valDrive.textContent = (OMEGA_RING / (2 * Math.PI)).toFixed(3) + ' rev/s';
  valCarrier.textContent = (OMEGA_CARRIER / (2 * Math.PI)).toFixed(3) + ' rev/s';

  btnClear.addEventListener('click', clearTrail);

  window.addEventListener('resize', function () {
    resizeCanvas();
    clearTrail();
  });

  resizeCanvas();

  // ── draw loop ──────────────────────────────────────────────────────────────
  function draw(timestamp) {
    if (startTime === null) startTime = timestamp;
    var t = (timestamp - startTime) / 1000; // elapsed seconds
    var W = canvas.width;
    var H = canvas.height;
    var unitPx = Math.min(W, H) * 0.24;

    var Rs = SUN_RADIUS_U * unitPx;
    var Rp = PLANET_RADIUS_U * unitPx;
    var Rc = CARRIER_RADIUS_U * unitPx;
    var Rr = RING_RADIUS_U * unitPx;

    // Positive angles are clockwise in canvas coordinates.
    var sunAngle = OMEGA_SUN * t;
    var ringAngle = OMEGA_RING * t;
    var carrierAngle = OMEGA_CARRIER * t;
    var planetSpinAngle = OMEGA_PLANET * t;

    // Planet center moves on the carrier radius.
    var px = Rc * Math.cos(carrierAngle);
    var py = Rc * Math.sin(carrierAngle);

    // Planet 0deg marker rotates with the planet body.
    var pMarkX = px + Rp * Math.cos(planetSpinAngle);
    var pMarkY = py + Rp * Math.sin(planetSpinAngle);

    trail.push({ x: pMarkX, y: pMarkY });
    if (trail.length > TRAIL_MAX) {
      trail.splice(0, trail.length - TRAIL_MAX);
    }

    // ── render ──────────────────────────────────────────────────────────────
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);

    // Planet marker trail.
    if (trail.length > 1) {
      var n = trail.length;
      var BATCHES = 8;
      var batchLen = Math.ceil(n / BATCHES);
      ctx.lineWidth = 1.5;
      for (var b = 0; b < BATCHES; b++) {
        var alpha = ((b + 1) / BATCHES) * 0.8;
        var s = b * batchLen;
        if (s >= n) break;
        var e = Math.min(s + batchLen + 1, n);
        ctx.beginPath();
        ctx.moveTo(trail[s].x, trail[s].y);
        for (var i = s + 1; i < e; i++) {
          ctx.lineTo(trail[i].x, trail[i].y);
        }
        ctx.strokeStyle = 'rgba(90, 240, 120, ' + alpha + ')';
        ctx.stroke();
      }
    }

    // Ring gear (astral) shown as a thick annulus.
    ctx.beginPath();
    ctx.arc(0, 0, Rr + 7, 0, 2 * Math.PI);
    ctx.arc(0, 0, Rr - 7, 0, 2 * Math.PI, true);
    ctx.fillStyle = '#2b3240';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#6b778f';
    ctx.stroke();

    // Carrier arm.
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(px, py);
    ctx.strokeStyle = 'rgba(180, 205, 235, 0.7)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Sun gear.
    ctx.beginPath();
    ctx.arc(0, 0, Rs, 0, 2 * Math.PI);
    ctx.fillStyle = '#2d3036';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#8f99aa';
    ctx.stroke();

    // Planet gear.
    ctx.beginPath();
    ctx.arc(px, py, Rp, 0, 2 * Math.PI);
    ctx.fillStyle = '#2d3036';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#8f99aa';
    ctx.stroke();

    // 0deg marker dots for visible rotation state.
    var sunMarkX = Rs * Math.cos(sunAngle);
    var sunMarkY = Rs * Math.sin(sunAngle);
    ctx.beginPath();
    ctx.arc(sunMarkX, sunMarkY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#ffd84a'; // yellow (sun)
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pMarkX, pMarkY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#66ff88'; // green (planet)
    ctx.fill();

    var ringMarkX = Rr * Math.cos(ringAngle);
    var ringMarkY = Rr * Math.sin(ringAngle);
    ctx.beginPath();
    ctx.arc(ringMarkX, ringMarkY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#b56dff'; // violet (astral ring)
    ctx.fill();

    // Centres.
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, 2 * Math.PI);
    ctx.fillStyle = '#999';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(px, py, 3, 0, 2 * Math.PI);
    ctx.fillStyle = '#999';
    ctx.fill();

    ctx.restore();

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
}());
</script>

</body>
</html>
